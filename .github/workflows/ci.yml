name: CI

# Offline suite — no cloud, no credentials, every CLI path runs with --dry-run.
# The Python layer (cis_cloud) drives the plain Terraform stacks; the wiring
# tests pin the registry <-> HCL contract.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Install dependencies
        run: pip install -e . pytest

      - name: Run suite
        run: pytest test_py -q

      - name: Terraform validate
        run: |
          set -e
          for dir in cis_cloud/data/modules/*; do
            echo "==> $dir"
            (cd "$dir" && terraform init -backend=false && terraform validate)
          done
          find cis_cloud/data/stacks -type f -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; \
            | sort -u | while read -r dir; do
              echo "==> $dir"
              (cd "$dir" && terraform init -backend=false && terraform validate)
            done
