name: CI

# Offline suite — no cloud, no credentials, every CLI path runs with --dry-run.
# The Python layer (cis_cloud) drives the plain Terraform stacks; the wiring
# tests pin the registry <-> HCL contract.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to Code Scanning
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Install dependencies
        run: pip install -e . pytest

      - name: Run suite
        run: pytest test_py -q

      - name: Offline E2E (real CLI, no credentials)
        run: python3 scripts/e2e_test.py --mode offline

      - name: Check README stays in sync with code
        run: python3 scripts/check_readme.py

      - name: Generate SARIF (offline tfcheck, no credentials)
        run: |
          cis-cloud --cloud aws check --tf test_py/fixtures/tf --format sarif \
            --output cis-scan.sarif || true
          test -s cis-scan.sarif

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cis-scan.sarif

      - name: Terraform validate
        run: |
          set -e
          for dir in cis_cloud/data/modules/*; do
            echo "==> $dir"
            (cd "$dir" && terraform init -backend=false && terraform validate)
          done
          find cis_cloud/data/stacks -type f -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; \
            | sort -u | while read -r dir; do
              echo "==> $dir"
              (cd "$dir" && terraform init -backend=false && terraform validate)
            done

  # Verifies the CI caching lifecycle end-to-end: a key derived from the
  # dependency file must (a) seed on first use, (b) restore on reuse, and
  # (c) change when the file changes (so stale caches are not reused).
  cache-health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compute dependency fingerprint
        id: fp
        run: echo "key=$(python3 scripts/cache_fingerprint.py)" >> "$GITHUB_OUTPUT"

      - name: Cache restore (same deps -> hit)
        id: cache
        uses: actions/cache@v4
        with:
          path: .cache-sentinel
          key: ${{ steps.fp.outputs.key }}

      - name: Seed or verify cache
        run: |
          if [ -f .cache-sentinel/ok ]; then
            echo "CACHE HIT: restored from key ${{ steps.fp.outputs.key }}"
            test "$(cat .cache-sentinel/ok)" = "seeded"
          else
            echo "CACHE MISS: seeding key ${{ steps.fp.outputs.key }}"
            mkdir -p .cache-sentinel
            echo "seeded" > .cache-sentinel/ok
          fi

      - name: Assert graceful degradation on cold cache
        # An expired/evicted cache (7-day access / 30-day retention) must not
        # break the build: dependency resolution works without any cache and
        # simply re-seeds it. This asserts the cache is an optimisation, not a
        # correctness dependency.
        run: |
          pip install --no-cache-dir -e . pytest >/dev/null 2>&1 || { echo "FAIL: cold-cache install failed" >&2; exit 1; }
          python3 -c "import cis_cloud, pytest; print('OK: install succeeds without cache (graceful degradation)')"

      - name: Assert invalidation contract (content change -> new key)
        run: |
          KEY1=$(python3 scripts/cache_fingerprint.py)
          echo '# bump' >> pyproject.toml
          KEY2=$(python3 scripts/cache_fingerprint.py)
          git checkout -- pyproject.toml
          echo "unchanged key: $KEY1"
          echo "changed  key: $KEY2"
          if [ "$KEY1" = "$KEY2" ]; then
            echo "FAIL: editing pyproject.toml did not change the cache key" >&2
            exit 1
          fi
          echo "OK: cache key is content-derived (invalidates on dep change)"

      - name: Assert cache-stampede safety (concurrent writers, no corruption)
        # Cache stampede / thundering herd: when several runs miss on a NEW
        # key at once, they race to write it. The seed must be atomic (a
        # single marker file) so concurrent writers never tear/corrupt the
        # cache, and the final state must be consistent and valid.
        run: |
          rm -rf .cache-stampede
          # N concurrent "seeders" all try to seed the same key simultaneously.
          for i in $(seq 1 8); do
            (
              mkdir -p .cache-stampede
              tmp=".cache-stampede/ok.$$.$RANDOM"
              printf 'seeded:%s\n' "$i" > "$tmp"       # write to a temp file first
              mv "$tmp" .cache-stampede/ok             # atomic rename -> no torn read
            ) &
          done
          wait
          # The final marker must be valid (one complete winner, not a mix).
          if [ ! -f .cache-stampede/ok ]; then
            echo "FAIL: stampede left no cache marker" >&2
            exit 1
          fi
          if ! grep -Eq '^seeded:[0-9]+$' .cache-stampede/ok; then
            echo "FAIL: stampede corrupted the cache marker: $(cat .cache-stampede/ok)" >&2
            exit 1
          fi
          echo "OK: 8 concurrent writers left a valid, uncorrupted cache marker"
          # Clean up so this job's own cache step (same key) is unaffected.
          rm -rf .cache-stampede
