[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cis-cloud"
version = "0.1.0"
description = "Multi-cloud CIS foundation benchmarks — plain Terraform scan/apply (tencent, aws, azure, gcp, alibaba)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "susunola" }]
keywords = ["cis", "security", "terraform", "compliance", "benchmark", "cloud"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
cis-cloud = "cis_cloud.cli:main"

[tool.setuptools]
packages = ["cis_cloud"]
include-package-data = true

[tool.setuptools.package-data]
cis_cloud = [
    "data/config/*.yml",
    "data/config/*/*.yml",
    "data/config/*.yaml",
    "data/config/*/*.yaml",
    "data/stacks/**/*.tf",
    "data/stacks/**/*.tfvars",
    "data/stacks/**/*.md",
    "data/modules/**/*.tf",
    "data/modules/**/*.md",
    "data/modules/**/*.json",
]

[tool.pytest.ini_options]
testpaths = ["test_py"]
